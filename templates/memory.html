<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Hafıza Oyunu - Titanlar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .memory-grid { display: grid; grid-template-columns: repeat(4, 80px); gap: 10px; justify-content: center; margin: 20px auto; }
        .card { width: 80px; height: 80px; background: #333; font-size: 2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 8px; }
        .card.flipped { background: #444; }
    </style>
</head>
<body style="text-align:center;">
    <h1>🧠 Hafıza Kartı Oyunu</h1>
    <p>Eşleşme Tamamlama Zamanı (Saniye cinsinden rekor için az olmalı)</p>
    <div class="memory-grid" id="memoryGrid"></div>
    <div style="margin-top:20px;"><a href="{{ url_for('games_hub') }}" class="btn">Oyunlara Dön</a></div>

    <script>
        const emojis = ['🍎', '🍎', '🍌', '🍌', '🍇', '🍇', '🍉', '🍉'];
        emojis.sort(() => 0.5 - Math.random());
        let flippedCards = [], matchedCount = 0, startTime = Date.now();
        const grid = document.getElementById('memoryGrid');

        emojis.forEach((emoji, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.emoji = emoji;
            card.onclick = () => {
                if (card.classList.contains('flipped') || flippedCards.length >= 2) return;
                card.innerText = emoji;
                card.classList.add('flipped');
                flippedCards.push(card);
                if (flippedCards.length === 2) {
                    setTimeout(checkMatch, 600);
                }
            };
            grid.appendChild(card);
        });

        function checkMatch() {
            const [c1, c2] = flippedCards;
            if (c1.dataset.emoji === c2.dataset.emoji) {
                matchedCount += 2;
                if (matchedCount === emojis.length) {
                    let seconds = Math.floor((Date.now() - startTime) / 1000);
                    alert("Tebrikler! Süre: " + seconds + " saniye.");
                    fetch("/api/score", {
                        method: "POST",
                        headers: {"Content-Type": "application/json", "X-CSRFToken": "{{ csrf_token() }}"},
                        body: JSON.stringify({game: "memory", val: seconds})
                    }).then(() => window.location.href = "{{ url_for('games_hub') }}");
                }
            } else {
                c1.innerText = ''; c1.classList.remove('flipped');
                c2.innerText = ''; c2.classList.remove('flipped');
            }
            flippedCards = [];
        }
    </script>
</body>
</html>
