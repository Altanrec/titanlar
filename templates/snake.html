<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Snake - Titanlar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="text-align:center;">
    <h1>🐍 Snake Oyunu</h1>
    <p>Skor: <span id="score">0</span></p>
    <canvas id="snakeCanvas" width="400" height="400" style="background:#111; border:2px solid #fff;"></canvas>
    <div>
        <br>
        <a href="{{ url_for('games_hub') }}" class="btn">Oyunlara Dön</a>
    </div>
    <script>
        const canvas = document.getElementById("snakeCanvas");
        const ctx = canvas.getContext("2d");
        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 1, dy = 0;
        let score = 0;

        function main() {
            if (hasGameEnded()) {
                sendScore("snake", score);
                alert("Oyun bitti! Skorun: " + score);
                window.location.href = "{{ url_for('games_hub') }}";
                return;
            }
            setTimeout(onTick, 100);
        }

        function onTick() {
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
            main();
        }

        function clearCanvas() {
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            ctx.fillStyle = "#00FF66";
            snake.forEach(part => ctx.fillRect(part.x * 20, part.y * 20, 18, 18));
        }

        function moveSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById("score").innerText = score;
                createFood();
            } else {
                snake.pop();
            }
        }

        function createFood() {
            food.x = Math.floor(Math.random() * 20);
            food.y = Math.floor(Math.random() * 20);
        }

        function drawFood() {
            ctx.fillStyle = "#FF0055";
            ctx.fillRect(food.x * 20, food.y * 20, 18, 18);
        }

        function hasGameEnded() {
            const head = snake[0];
            if (head.x < 0 || head.x > 19 || head.y < 0 || head.y > 19) return true;
            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) return true;
            }
            return false;
        }

        document.addEventListener("keydown", e => {
            if (e.key === "ArrowLeft" && dx === 0) { dx = -1; dy = 0; }
            if (e.key === "ArrowUp" && dy === 0) { dx = 0; dy = -1; }
            if (e.key === "ArrowRight" && dx === 0) { dx = 1; dy = 0; }
            if (e.key === "ArrowDown" && dy === 0) { dx = 0; dy = 1; }
        });

        function sendScore(game, val) {
            fetch("/api/score", {
                method: "POST",
                headers: {"Content-Type": "application/json", "X-CSRFToken": "{{ csrf_token() }}"},
                body: JSON.stringify({game, val})
            });
        }
        createFood();
        main();
    </script>
</body>
</html>
