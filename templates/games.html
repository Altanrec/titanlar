<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Oyun Salonu - Titanlar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🎮 Titanlar Oyun Salonu</h1>
        <div class="games-grid">
            <div class="game-card">
                <h3>🐍 Yılan Oyunu (Snake)</h3>
                <p>Yılanı büyütrken rekoru kır, puanları topla!</p>
                <a href="{{ url_for('game_snake') }}" class="btn">Oyna</a>
            </div>
            <div class="game-card">
                <h3>❌ Tic-Tac-Toe (XOX)</h3>
                <p>Rakibini alt et, galibiyet serisi yap.</p>
                <a href="{{ url_for('game_xox') }}" class="btn">Oyna</a>
            </div>
            <div class="game-card">
                <h3>🧠 Hafıza Oyunu (Memory)</h3>
                <p>Kartları eşleştir, zekanı konuştur.</p>
                <a href="{{ url_for('game_memory') }}" class="btn">Oyna</a>
            </div>
        </div>
        <div style="margin-top: 30px;">
            <a href="{{ url_for('account') }}" class="btn">Profilime Dön</a>
            <a href="{{ url_for('leaderboard') }}" class="btn">Sıralama</a>
        </div>
    </div>
</body>
</html>
